<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afinações de Teares</title>
<meta name="theme-color" content="#17212b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --ink:#17212b; --ink2:#44505c; --mute:#7a8591; --paper:#f4f1ea; --card:#fff; --line:#dcd7cb;
  --accent:#d99a00; --accent-soft:#fff4d6; --primary:#1f3a54; --danger:#b3261e; --ok:#2e7d4f;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.top .bar{display:flex;align-items:center;gap:12px;padding:8px 16px}
.brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:50%;border:3px solid var(--accent);display:inline-block}
.spacer{flex:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;scrollbar-width:none;background:#0f1820}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:#c5cdd5;text-decoration:none;padding:10px 14px;white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
nav.tabs a.on{color:#fff;border-bottom-color:var(--accent)}
nav.tabs a .n{font-size:11px;background:#2a3844;border-radius:9px;padding:1px 7px;margin-left:5px;color:#c5cdd5}
main{max-width:none;margin:0 auto;padding:16px 24px}
h1{font-size:20px;margin:0 0 12px}
h2{font-size:15px;margin:0 0 8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:38px}
.btn:hover{border-color:var(--ink2)}
a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#1b1400}
.btn.dng{color:var(--danger)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.top .btn{background:transparent;color:#fff;border-color:#3a4855}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;min-height:38px}
.toolbar input[type=search]{flex:1;min-width:160px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
table.list{border-collapse:collapse;width:100%}
table.list th{font-size:11px;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:#faf8f3;position:sticky;top:0}
table.list td{font-size:14px;padding:8px 10px;border-bottom:1px solid #eee9de;vertical-align:middle}
table.list tr.row{cursor:pointer}
table.list tr.row:hover td{background:var(--accent-soft)}
td.tear{font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:12px;padding:2px 9px;background:#e8edf2;color:var(--primary)}
.acts{white-space:nowrap;text-align:right}
.art{min-width:170px;max-width:340px}
td.obs{max-width:260px;color:var(--ink2);font-size:13px}
td.lfa{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
/* blocos coloridos */
.blk{background:var(--bg);border:1px solid var(--bd);border-left:7px solid var(--bd);border-radius:10px;padding:10px 14px 12px;margin-bottom:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.blk>h2{display:inline-block;margin:0 0 8px;background:var(--bd);color:#fff;border-radius:12px;padding:2px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.blk label.f input,.blk label.f textarea{border-color:color-mix(in srgb,var(--bd) 45%,#fff)}
.blk label.f{color:var(--tx)}
.yrow{display:grid;grid-template-columns:minmax(200px,3fr) repeat(var(--n),minmax(78px,1fr)) 34px;gap:8px;align-items:end;margin-bottom:6px}
.yrow.extra .lb{display:none}
.yrow .rmfio{min-height:40px;padding:0}
.addfio{margin-top:4px;border-color:var(--bd);color:var(--tx);background:#fff}
.lt{width:100%;border-collapse:separate;border-spacing:0 3px}
.lt th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx);text-align:left;padding:0 8px}
.lt td{background:#fff;border:1px solid color-mix(in srgb,var(--bd) 40%,#fff);border-width:1px 0;padding:5px 8px;font-weight:600}
.lt td:first-child{border-left-width:1px;border-radius:6px 0 0 6px}.lt td:last-child{border-right-width:1px;border-radius:0 6px 6px 0}
.lt td.fio{width:34%}
.kv .w3{grid-column:1/-1}.kv .big{font-size:16px}
.blk .kv div{background:#fff;border-color:color-mix(in srgb,var(--bd) 40%,#fff)}
.sheet .blk{break-inside:avoid;padding:8px 12px 10px;margin-bottom:9px}
.empty{padding:40px;text-align:center;color:var(--mute)}
.count{color:var(--mute);font-size:13px;margin-left:auto}
/* form */
.fgroup{margin-bottom:14px}
.fgroup h2{display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--primary)}
.fgroup h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid .w2{grid-column:span 2}
.grid .w3{grid-column:1/-1}
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink2)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-weight:400;color:var(--ink);min-height:40px}
label.f input:focus,label.f textarea:focus,.toolbar input:focus,.toolbar select:focus{outline:2px solid var(--accent);border-color:var(--accent)}
label.f textarea{min-height:70px;resize:vertical}
.req::after{content:" *";color:var(--danger)}
.formbar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--paper) 30%);padding:14px 0 calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap}
/* login / tipos */
.login{max-width:360px;margin:8vh auto}
.tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tipos a{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-left:6px solid var(--c,var(--primary));border-radius:var(--radius);padding:14px;font-weight:700}
.tipos a small{display:block;color:var(--mute);font-weight:400}
.tipos a:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.notice{background:var(--accent-soft);border:1px solid #ecd48c;border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast.err{background:var(--danger)}
/* ficha técnica */
.sheet{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;max-width:210mm;margin:0 auto}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:12px;gap:12px}
.sh-head .emp{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.sh-head h1{margin:2px 0 0;font-size:20px;text-transform:uppercase}
.sh-head .tp{font-size:18px;font-weight:800;text-align:right;color:var(--primary)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.meta div,.kv div{border:1px solid var(--line);border-radius:6px;padding:5px 9px}
.meta b,.kv b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
.meta span.big{font-size:17px;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:6px}
.kv .w2{grid-column:span 2}
.kv span{font-weight:600;word-break:break-word}
.sheet .fgroup{break-inside:avoid}
.sh-foot{margin-top:14px;font-size:11px;color:var(--mute);display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px}
.opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.opts label{display:flex;gap:6px;align-items:center}
/* mobile: tabela vira cartões */
@media (max-width:720px){
  main{padding:10px}
  table.list thead{display:none}
  table.list,table.list tbody,table.list tr,table.list td{display:block;width:100%}
  table.list tr.row{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px}
  table.list td{border:0;padding:1px 0}
  table.list td.tear{grid-row:1/3;font-size:22px;align-self:center}
  table.list td.hide-m{display:none}
  table.list td.art,table.list td.lfa{grid-column:2/-1;max-width:none}
  table.list td.lfa::before{content:'LFA ';color:var(--mute);font-weight:400}
  table.list td.acts{grid-column:1/-1;text-align:left;padding-top:6px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .yrow{grid-template-columns:1fr 1fr 1fr}
  .yrow label:first-child{grid-column:1/-1}
  .yrow .rmfio{min-height:36px}
  .yrow.extra .rmfio{grid-column:1/-1}
}
/* impressão */
@media print{
  @page{size:A4;margin:11mm}
  html,body{background:#fff;font-size:12px}
  header.top,.noprint,.toast{display:none!important}
  main{padding:0;max-width:none}
  .sheet{border:0;padding:0;max-width:none;border-radius:0}
}
</style>
</head>
<body>
<header class="top noprint" id="top" hidden>
  <div class="bar">
    <div class="brand"><i></i> Afinações de Teares</div>
    <div class="spacer"></div>
    <button class="btn sm" id="btnTools">Ferramentas</button>
    <button class="btn sm" id="btnOut">Sair</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* =====================================================================
   1. DEFINIÇÃO DOS TIPOS DE MALHA  (ver o Excel original, uma folha = um tipo)
   Para acrescentar/alterar campos basta editar esta secção.
   ===================================================================== */
const f = (k,l,o={}) => ({k,l,...o});
// Paleta por bloco (fundo claro, cor forte, cor do título) — mesma cor em formulário, ficha e impressão
const PAL = {
  id:    {bd:'#44505c', bg:'#f3f3f1', tx:'#2b343d'},
  art:   {bd:'#1f8a8a', bg:'#e2f3f3', tx:'#0f5757'},   // artigo: verde-azulado
  jersey:{bd:'#2f6fb3', bg:'#e6f0fb', tx:'#1b4a80'},   // jersey / fio principal: azul
  lig:   {bd:'#2e8b57', bg:'#e4f5ea', tx:'#1b5e39'},   // ligação: verde
  arg:   {bd:'#d9822b', bg:'#fdeedd', tx:'#8f4d0c'},   // argola: laranja
  lycra: {bd:'#8e44ad', bg:'#f2e8f9', tx:'#5e2a78'},   // lycra: roxo
  prod:  {bd:'#8a8578', bg:'#f0eee8', tx:'#4f4b42'}    // produção / descarga: cinza quente
};
// Bloco "linhas" (linhas:1) = pode ter várias linhas de fio; cada linha tem fio + LFA + afinação + pontos juntos.
// A 1ª linha usa as chaves originais (compatível com os dados importados); as restantes ficam em <id>_mais.
const ART  = extra => ({id:'art', t:'Artigo', c:'art', f:[f('artigo','Descrição do artigo de malha',{w:3}), ...extra]});
const PROD = () => ({id:'prod', t:'Produção', c:'prod', f:[f('bloco','Bloco'), f('descarga','Descarga'), f('tiragem','Tiragem')]});
const FIOBLK = fs => ({id:'f', t:'Fio e afinação', c:'jersey', linhas:1, f:fs});
const LYCRA = fs => ({id:'ly', t:'Lycra', c:'lycra', linhas:1, pref:1, f:fs});

const pontos = p => [f(p+'_lfa','LFA'), f(p+'_afin','Afinação'), f(p+'_agulha','Ponto Agulha'), f(p+'_platina','Ponto Platina')];
const ACUM = () => ({id:'al', t:'Acumulação / Ligação', c:'lig', linhas:1, pref:1, f:[f('fio_acum','Fio Acumulação / Ligação'), ...pontos('al')]});
const jerseyLike = acum => [
  ART([f('jogo','Jogo')]),
  FIOBLK([f('fio','Fio'), f('cabos','Cabos'), f('lfa','LFA'), f('afinacao','Afinação'), f('ponto_placa','Ponto Placa')]),
  ...(acum ? [ACUM()] : []),
  LYCRA([f('lycra_desc','Lycra - descrição'), f('lycra_afin','Afinação')]),
  PROD()
];
const ribLike = acum => [
  ART([f('jogo','Jogo'), f('selecao','Seleção')]),
  FIOBLK([f('fio','Fio'), f('cabos','Cabos'), f('lfa','LFA'), f('afin_fio','Afinação'), f('ponto_cima','Ponto cima'), f('ponto_baixo','Ponto baixo')]),
  ...(acum ? [ACUM()] : []),
  LYCRA([f('lycra_desc','Lycra - descrição'), f('afin_lycra','Afinação'), f('tricotada','Tricotada')]),
  {id:'dd', t:'Descarga / Disco', c:'prod', f:[f('descarga','Descarga'), f('disco','Disco')]}
];
const JERSEY_LIKE = jerseyLike(false), PIQUE_LIKE = jerseyLike(true), RIB_LIKE = ribLike(false), RIBA_LIKE = ribLike(true);
// xl = ordem das colunas no Excel (para importar). skip = coluna a ignorar (Estado, Chave…)
const XL_JERSEY = ['tear','data','cliente','jogo','fio','cabos','lfa','afinacao','ponto_placa','lycra_desc','lycra_afin','bloco','descarga','tiragem','observacoes','skip','skip'];
const XL_RIB    = ['tear','jogo','data','cliente','selecao','fio','cabos','lfa','afin_fio','lycra_desc','afin_lycra','tricotada','ponto_cima','ponto_baixo','descarga','disco','observacoes','skip','skip'];

const TIPOS = {
  felpa: { nome:'Felpa Americana', cor:'#c2410c', sheet:'Felpas', lfa:'j_lfa',
    cols:['gramagem','fio_jersey','j_afin','fio_ligacao','l_lfa','l_afin','fio_argola','a_lfa','a_afin','tiragem'],
    blocos:[
      ART([f('gramagem','Gramagem')]),
      {id:'j',  t:'Jersey',  c:'jersey', linhas:1, pref:1, f:[f('fio_jersey','Fio Jersey'),   ...pontos('j')]},
      {id:'l',  t:'Ligação', c:'lig',    linhas:1, pref:1, f:[f('fio_ligacao','Fio Ligação'), ...pontos('l')]},
      {id:'a',  t:'Argola',  c:'arg',    linhas:1, pref:1, f:[f('fio_argola','Fio Argola'),   ...pontos('a')]},
      {id:'ly', t:'Lycra',   c:'lycra',  linhas:1, pref:1, f:[f('fio_lycra','Lycra - descrição'), ...pontos('ly')]},
      PROD()
    ],
    xl:['tear','data','cliente','gramagem','fio_jersey','fio_ligacao','fio_argola',
        'j_lfa','j_afin','j_agulha','j_platina','l_lfa','l_afin','l_agulha','l_platina',
        'a_lfa','a_afin','a_agulha','a_platina','ly_lfa','ly_afin','ly_agulha','ly_platina',
        'bloco','descarga','tiragem','observacoes','skip','skip'] },
  jersey: { nome:'Jersey', cor:'#1f6f8b', sheet:'Jersey', lfa:'lfa', cols:['fio','afinacao','lycra_desc','lycra_afin','bloco','descarga','tiragem'], blocos:JERSEY_LIKE, xl:XL_JERSEY },
  pique:  { nome:'Piqué',  cor:'#6d4c9f', sheet:'PIQUÉ',  lfa:'lfa', cols:['fio','afinacao','fio_acum','al_lfa','al_afin','lycra_desc','lycra_afin','bloco','descarga','tiragem'], blocos:PIQUE_LIKE, xl:XL_JERSEY },
  italiana:{ nome:'Felpa Italiana', cor:'#a21c4a', sheet:'Felpa Italiana', lfa:'j_lfa',
    cols:['jogo','fio_jersey','j_afin','fio_argola','a_lfa','a_afin','lycra_desc','tiragem'],
    blocos:[
      ART([f('jogo','Jogo')]),
      {id:'j', t:'Jersey', c:'jersey', linhas:1, pref:1, f:[f('fio_jersey','Fio Jersey'), f('j_lfa','LFA'), f('j_afin','Afinação'), f('j_placa','Ponto Placa')]},
      {id:'a', t:'Argola', c:'arg',    linhas:1, pref:1, f:[f('fio_argola','Fio Argola'), f('a_lfa','LFA'), f('a_afin','Afinação'), f('a_placa','Ponto Placa')]},
      LYCRA([f('lycra_desc','Lycra - descrição'), f('lycra_afin','Afinação')]),
      PROD()
    ],
    xl:['tear','data','cliente','jogo','fio_jersey','j_lfa','j_afin','j_placa','fio_argola','a_lfa','a_afin','a_placa','lycra_desc','lycra_afin','bloco','descarga','tiragem','observacoes','skip','skip'] },
  rib:       { nome:'Rib',        cor:'#2e7d4f', sheet:'Rib',        lfa:'lfa', cols:['selecao','fio','afin_fio','lycra_desc','afin_lycra','ponto_cima','ponto_baixo','descarga','disco'], blocos:RIB_LIKE, xl:XL_RIB },
  dupla:     { nome:'Dupla Face', cor:'#8a6d00', sheet:'Dupla Face', lfa:'lfa', cols:['selecao','fio','afin_fio','fio_acum','al_lfa','al_afin','lycra_desc','afin_lycra','ponto_cima','ponto_baixo','descarga','disco'], blocos:RIBA_LIKE, xl:XL_RIB },
  interlock: { nome:'Interlock',  cor:'#37474f', sheet:'INTERLOCK',  lfa:'lfa', cols:['selecao','fio','afin_fio','fio_acum','al_lfa','al_afin','lycra_desc','afin_lycra','ponto_cima','ponto_baixo','descarga','disco'], blocos:RIBA_LIKE, xl:XL_RIB }
};
// chave do campo -> bloco a que pertence
const KB = {};
Object.entries(TIPOS).forEach(([k,t]) => { KB[k]={}; t.blocos.forEach(b => b.f.forEach(x => KB[k][x.k]=b)); });
// todos os valores de um campo (1ª linha + linhas adicionais)
const vals = (tipo,d,k) => { const b=KB[tipo][k], o=[d[k]]; if(b&&b.linhas) (d[b.id+'_mais']||[]).forEach(x=>o.push(x[k])); return o.filter(Boolean); };
const val  = (tipo,d,k) => vals(tipo,d,k).join(' + ');
const labelOf = (t,k) => { if(k==='artigo') return 'Artigo';
  for (const b of TIPOS[t].blocos) for (const [i,x] of b.f.entries()) if (x.k===k) return (b.pref && i>0 ? b.t+' · ' : '') + x.l; return k; };
// versão anterior guardava fios adicionais como texto em <fio>_mais: converte para linhas
function migrar(tipo,d){
  TIPOS[tipo].blocos.filter(b=>b.linhas).forEach(b => { const k=b.f[0].k+'_mais', a=d[k];
    if(Array.isArray(a) && a.every(z=>typeof z==='string')){ d[b.id+'_mais']=[...(d[b.id+'_mais']||[]), ...a.map(z=>({[b.f[0].k]:z}))]; delete d[k]; } });
  return d;
}
const flat = o => o==null ? '' : typeof o==='object' ? Object.values(o).map(flat).join(' ') : String(o);

/* =====================================================================
   2. SUPABASE
   ===================================================================== */
const CFG = window.APP_CONFIG || {};
const T_REG='teares_afinacoes';
const configured = CFG.SUPABASE_URL && !/SEU-PROJETO/.test(CFG.SUPABASE_URL) && CFG.SUPABASE_ANON_KEY && !/COLE-AQUI/.test(CFG.SUPABASE_ANON_KEY);
let sb = null;
const S = { user:null, regs:[], filt:{q:'',tear:'',cliente:'',ano:''} };

const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtData = d => d ? d.split('-').reverse().join('/') : '';
const hoje = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
function toast(msg, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), err?5000:2200); }

async function fetchAll(table, col, asc){
  let out=[], from=0;
  for(;;){
    const {data,error} = await sb.from(table).select('*').order(col,{ascending:asc}).range(from,from+999);
    if(error) throw error;
    out = out.concat(data);
    if(data.length<1000) break; from+=1000;
  }
  return out;
}
async function loadAll(){ S.regs = await fetchAll(T_REG,'data',false); S.regs.forEach(r => { r.dados = migrar(r.tipo, r.dados||{}); }); }

/* =====================================================================
   3. ROUTER
   ===================================================================== */
const app = $('#app');
window.addEventListener('hashchange', render);

function drawTabs(cur){
  const n = t => S.regs.filter(r=>r.tipo===t).length;
  $('#tabs').innerHTML =
    `<a href="#/" class="${cur==='todas'?'on':''}">Todas<span class="n">${S.regs.length}</span></a>` +
    Object.entries(TIPOS).map(([k,t]) => `<a href="#/tipo/${k}" class="${cur===k?'on':''}">${esc(t.nome)}<span class="n">${n(k)}</span></a>`).join('');
}

function render(){
  if(!configured){ return viewSetup(); }
  if(!S.user){ $('#top').hidden=true; return viewLogin(); }
  $('#top').hidden=false;
  const [,r,a] = (location.hash||'#/').split('/');
  window.scrollTo(0,0);
  if(r==='tipo' && TIPOS[a]) { drawTabs(a); return viewList(a); }
  if(r==='novo'){ drawTabs(a||'todas'); return a && TIPOS[a] ? viewForm({tipo:a}) : viewEscolher(); }
  if(r==='editar'){ const x=S.regs.find(z=>z.id===a); if(x){ drawTabs(x.tipo); return viewForm({reg:x}); } }
  if(r==='duplicar'){ const x=S.regs.find(z=>z.id===a); if(x){ drawTabs(x.tipo); return viewForm({tipo:x.tipo, copia:x}); } }
  if(r==='ficha'){ const x=S.regs.find(z=>z.id===a); if(x){ drawTabs(x.tipo); return viewFicha(x); } }
  if(r==='ferramentas'){ drawTabs(''); return viewTools(); }
  drawTabs('todas'); viewList(null);
}

/* ---------- setup / login ---------- */
function viewSetup(){
  $('#top').hidden=true;
  app.innerHTML = `<div class="login card"><h1>Falta configurar</h1>
    <p>Abra o ficheiro <b>config.js</b> e preencha <b>SUPABASE_URL</b> e <b>SUPABASE_ANON_KEY</b> (Supabase → Project Settings → API).</p>
    <p>Depois execute o <b>schema.sql</b> no SQL Editor do Supabase.</p></div>`;
}
function viewLogin(){
  app.innerHTML = `<form class="login card" id="lf"><h1>Afinações de Teares</h1>
    <label class="f">E-mail<input type="email" name="email" required autocomplete="username"></label><br>
    <label class="f">Palavra-passe<input type="password" name="pw" required autocomplete="current-password"></label><br>
    <button class="btn pri" style="width:100%">Entrar</button></form>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const {error} = await sb.auth.signInWithPassword({email:fd.get('email'), password:fd.get('pw')});
    if(error) toast('Falha no login: '+error.message, true);
  };
}

/* ---------- escolher tipo ---------- */
function viewEscolher(){
  app.innerHTML = `<h1>Novo registo — escolha o tipo de malha</h1><div class="tipos">` +
    Object.entries(TIPOS).map(([k,t]) => `<a href="#/novo/${k}" style="--c:${t.cor}">${esc(t.nome)}<small>${t.blocos.reduce((n,g)=>n+g.f.length,0)} campos de afinação</small></a>`).join('') + `</div>`;
}

/* ---------- lista ---------- */
function viewList(tipo){
  const t = tipo && TIPOS[tipo];
  const base = S.regs.filter(r => !tipo || r.tipo===tipo);
  const tears = [...new Set(base.map(r=>r.tear))].sort((a,b)=>a-b);
  const clientes = [...new Set(base.map(r=>r.cliente))].sort((a,b)=>a.localeCompare(b,'pt'));
  const anos = [...new Set(base.map(r=>r.data.slice(0,4)))].sort().reverse();
  app.innerHTML = `
    <div class="toolbar">
      <h1 style="margin:0 12px 0 0">${t?esc(t.nome):'Todas as afinações'}</h1>
      <input type="search" id="q" placeholder="Pesquisar (cliente, artigo, fio, LFA, observações…)" value="${esc(S.filt.q)}">
      <select id="ftear"><option value="">Todos os teares</option>${tears.map(x=>`<option ${S.filt.tear==x?'selected':''}>${x}</option>`).join('')}</select>
      <select id="fcli"><option value="">Todos os clientes</option>${clientes.map(x=>`<option ${S.filt.cliente===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <select id="fano"><option value="">Todos os anos</option>${anos.map(x=>`<option ${S.filt.ano===x?'selected':''}>${x}</option>`).join('')}</select>
      <a class="btn acc" href="${t?'#/novo/'+tipo:'#/novo'}">+ Novo registo</a>
    </div>
    <div class="tbl-wrap"><table class="list"><thead id="thead"></thead><tbody id="tb"></tbody></table><div id="cnt" class="empty" hidden></div></div>`;
  const colsT = t ? t.cols : ['fio','afin'];
  const hdr = k => k==='fio' && !t ? 'Fio' : k==='afin' && !t ? 'Afinação' : labelOf(tipo,k);
  $('#thead').innerHTML = `<tr>${t?'':'<th>Tipo</th>'}<th>Tear</th><th>Data</th><th>Cliente</th><th>Artigo</th><th>LFA</th>` +
    colsT.map(k=>`<th class="hide-m">${esc(hdr(k))}</th>`).join('') + `<th class="hide-m">Observações</th><th></th></tr>`;
  const draw = () => {
    S.filt.q=$('#q').value; S.filt.tear=$('#ftear').value; S.filt.cliente=$('#fcli').value; S.filt.ano=$('#fano').value;
    const q = S.filt.q.trim().toLowerCase();
    const rows = base.filter(r =>
      (!S.filt.tear || String(r.tear)===S.filt.tear) && (!S.filt.cliente || r.cliente===S.filt.cliente) &&
      (!S.filt.ano || r.data.startsWith(S.filt.ano)) &&
      (!q || (r.cliente+' '+(r.observacoes||'')+' '+flat(r.dados)+' '+r.tear).toLowerCase().includes(q)));
    $('#tb').innerHTML = rows.map(r => {
      const rt = TIPOS[r.tipo]; const d = r.dados||{};
      return `<tr class="row" data-id="${r.id}">
        ${t?'':`<td><span class="chip" style="background:${rt.cor}1a;color:${rt.cor}">${esc(rt.nome)}</span></td>`}
        <td class="tear">${r.tear}</td><td>${fmtData(r.data)}</td><td>${esc(r.cliente)}</td>
        <td class="art">${esc(d.artigo)}</td><td class="lfa">${esc(vals(r.tipo,d,rt.lfa)[0])}${vals(r.tipo,d,rt.lfa).length>1?` <small>+${vals(r.tipo,d,rt.lfa).length-1}</small>`:''}</td>
        ${t ? t.cols.map(k=>`<td class="hide-m">${esc(val(r.tipo,d,k))}</td>`).join('')
            : `<td class="hide-m">${esc(val(r.tipo,d,'fio')||val(r.tipo,d,'fio_jersey'))}</td><td class="hide-m">${esc(val(r.tipo,d,'afinacao')||val(r.tipo,d,'afin_fio')||val(r.tipo,d,'j_afin'))}</td>`}
        <td class="hide-m obs" title="${esc(r.observacoes)}">${esc(r.observacoes)}</td>
        <td class="acts"><a class="btn sm" href="#/ficha/${r.id}">Ficha</a> <a class="btn sm" href="#/editar/${r.id}">Editar</a>
          <a class="btn sm" href="#/duplicar/${r.id}">Duplicar</a> <button class="btn sm dng" data-del="${r.id}">Eliminar</button></td></tr>`;
    }).join('');
    const c=$('#cnt'); c.hidden = rows.length>0; c.textContent = base.length ? 'Nenhum registo com estes filtros.' : 'Ainda não há registos. Use “+ Novo registo” ou importe o Excel em Ferramentas.';
  };
  ['q','ftear','fcli','fano'].forEach(id => $('#'+id).addEventListener(id==='q'?'input':'change', draw));
  $('#tb').onclick = async e => {
    const del = e.target.closest('[data-del]');
    if(del){ e.stopPropagation(); return apagar(del.dataset.del); }
    if(e.target.closest('a,button')) return;
    const tr = e.target.closest('tr.row'); if(tr) location.hash = '#/ficha/'+tr.dataset.id;
  };
  draw();
}

async function apagar(id){
  const r = S.regs.find(x=>x.id===id); if(!r) return;
  if(!confirm(`Eliminar a afinação do tear ${r.tear} (${fmtData(r.data)} – ${r.cliente})? Esta ação não pode ser desfeita.`)) return;
  try{
    const {error} = await sb.from(T_REG).delete().eq('id',id); if(error) throw error;
    S.regs = S.regs.filter(x=>x.id!==id);
    toast('Registo eliminado'); render();
  }catch(e){ toast('Erro: '+e.message, true); }
}

/* ---------- formulário ---------- */
const sty = c => `--bd:${PAL[c].bd};--bg:${PAL[c].bg};--tx:${PAL[c].tx}`;
async function viewForm({tipo, reg, copia}){
  const edit = !!reg; const src = reg || copia;
  tipo = tipo || reg.tipo; const t = TIPOS[tipo];
  const d = src ? (src.dados||{}) : {};
  const clientes = [...new Set(S.regs.map(r=>r.cliente))].sort((a,b)=>a.localeCompare(b,'pt'));
  // uma linha de fio: fio + LFA + afinação + pontos, lado a lado
  const rowHtml = (b,v,extra) => `<div class="yrow ${extra?'extra':''}" style="--n:${b.f.length-1}">` +
    b.f.map(x => `<label class="f"><span class="lb">${esc(x.l)}</span><input data-k="${x.k}" ${extra?'':`name="d_${x.k}"`} value="${esc(v[x.k])}" placeholder="${esc(x.l)}" autocomplete="off"></label>`).join('') +
    (extra ? '<button type="button" class="btn sm dng rmfio" title="Remover esta linha">×</button>' : '<span></span>') + '</div>';
  const blkHtml = b => b.linhas
    ? `<section class="blk" data-b="${b.id}" style="${sty(b.c)}"><h2>${esc(b.t)}</h2><div class="rows">${rowHtml(b,d,false)}${(d[b.id+'_mais']||[]).map(v=>rowHtml(b,v,true)).join('')}</div><button type="button" class="btn sm addfio">+ Adicionar fio</button></section>`
    : `<section class="blk" data-b="${b.id}" style="${sty(b.c)}"><h2>${esc(b.t)}</h2><div class="grid">${b.f.map(x=>`<label class="f ${x.w===3?'w3':''}">${esc(x.l)}<input name="d_${x.k}" value="${esc(d[x.k])}" autocomplete="off"></label>`).join('')}</div></section>`;

  app.innerHTML = `<form id="rf" autocomplete="off" style="max-width:1600px;margin:0 auto">
    <h1><span class="chip" style="background:${t.cor}1a;color:${t.cor}">${esc(t.nome)}</span> ${edit?'Editar afinação':copia?'Nova afinação (cópia)':'Nova afinação'}</h1>
    <section class="blk" style="${sty('id')}"><h2>Identificação</h2><div class="grid">
      <label class="f"><span class="req">Nº Tear</span><input name="tear" type="number" min="1" required inputmode="numeric" value="${src?src.tear:''}"></label>
      <label class="f"><span class="req">Data</span><input name="data" type="date" required value="${edit?src.data:hoje()}"></label>
      <label class="f w2"><span class="req">Cliente</span><input name="cliente" list="dl-cli" required value="${esc(src?src.cliente:'')}"></label>
      <datalist id="dl-cli">${clientes.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    </div></section>
    ${t.blocos.map(blkHtml).join('')}
    <section class="blk" style="${sty('id')}"><h2>Observações</h2><label class="f"><textarea name="observacoes">${esc(src?src.observacoes:'')}</textarea></label></section>
    <div class="formbar"><button class="btn pri" id="save">Guardar</button><a class="btn" href="${edit?'#/ficha/'+reg.id:'#/tipo/'+tipo}">Cancelar</a></div>
  </form>`;

  $('#rf').addEventListener('click', e => {
    const add = e.target.closest('.addfio'), rm = e.target.closest('.rmfio');
    if(add){ const sec=add.closest('[data-b]'), b=t.blocos.find(x=>x.id===sec.dataset.b), rows=$('.rows',sec);
      rows.insertAdjacentHTML('beforeend', rowHtml(b,{},true)); rows.lastElementChild.querySelector('input').focus(); }
    if(rm) rm.closest('.yrow').remove();
  });

  $('#rf').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const row = { tipo, tear:+fd.get('tear'), data:fd.get('data'), cliente:fd.get('cliente').trim(), observacoes:(fd.get('observacoes')||'').trim()||null, dados:{} };
    t.blocos.forEach(b => {
      b.f.forEach(x => { const v=(fd.get('d_'+x.k)||'').trim(); if(v) row.dados[x.k]=v; });
      if(b.linhas){
        const ex = $$('.yrow.extra', $(`[data-b="${b.id}"]`)).map(r => { const o={}; $$('input',r).forEach(i => { const v=i.value.trim(); if(v) o[i.dataset.k]=v; }); return o; }).filter(o=>Object.keys(o).length);
        if(ex.length) row.dados[b.id+'_mais']=ex;
      }
    });
    const dup = S.regs.find(r => r.tipo===tipo && r.tear===row.tear && r.data===row.data && r.cliente.toLowerCase()===row.cliente.toLowerCase() && (!edit || r.id!==reg.id));
    if(dup && !confirm('Já existe uma afinação deste tipo para o mesmo tear, data e cliente.\nGuardar mesmo assim?')) return;
    const btn=$('#save'); btn.disabled=true; btn.textContent='A guardar…';
    try{
      let id;
      if(edit){ const {error}=await sb.from(T_REG).update(row).eq('id',reg.id); if(error) throw error; id=reg.id; }
      else { const {data,error}=await sb.from(T_REG).insert(row).select().single(); if(error) throw error; id=data.id; }
      await loadAll();
      toast('Guardado'); location.hash = '#/ficha/'+id;
    }catch(err){ toast('Erro ao guardar: '+(err.message||err), true); btn.disabled=false; btn.textContent='Guardar'; }
  };
}

/* ---------- ficha técnica (ecrã + impressão) ---------- */
async function viewFicha(r){
  const t = TIPOS[r.tipo], d = r.dados||{};
  const draw = () => {
    const vazios = $('#ov')?.checked;
    const blk = b => {
      const st = sty(b.c);
      if(b.linhas){
        let lines = [d, ...(d[b.id+'_mais']||[])].filter(l => b.f.some(x=>l[x.k]));
        if(!lines.length){ if(!vazios) return ''; lines=[{}]; }
        const cols = b.f.filter(x => vazios || lines.some(l=>l[x.k]));
        return `<section class="blk" style="${st}"><h2>${esc(b.t)}</h2><table class="lt"><thead><tr>${cols.map(x=>`<th>${esc(x.l)}</th>`).join('')}</tr></thead>
          <tbody>${lines.map(l=>`<tr>${cols.map(x=>`<td class="${x===b.f[0]?'fio':''}">${esc(l[x.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></section>`;
      }
      const fs = b.f.filter(x => vazios || d[x.k]);
      if(!fs.length) return '';
      return `<section class="blk" style="${st}"><h2>${esc(b.t)}</h2><div class="kv">${fs.map(x=>`<div class="${x.w===3?'w3':''}"><b>${esc(x.l)}</b><span class="${x.w===3?'big':''}">${esc(d[x.k])||'&nbsp;'}</span></div>`).join('')}</div></section>`;
    };
    $('#sheet').innerHTML = `
      <div class="sh-head"><div><div class="emp">${esc(CFG.EMPRESA||'')}</div><h1>Ficha técnica de afinação</h1></div><div class="tp">${esc(t.nome)}</div></div>
      <div class="meta"><div><b>Nº Tear</b><span class="big">${r.tear}</span></div><div><b>Data</b><span class="big">${fmtData(r.data)}</span></div><div style="grid-column:span 2"><b>Cliente</b><span class="big">${esc(r.cliente)}</span></div></div>
      ${t.blocos.map(blk).join('')}
      ${r.observacoes?`<section class="blk" style="${sty('id')}"><h2>Observações</h2><div style="white-space:pre-wrap">${esc(r.observacoes)}</div></section>`:''}
      <div class="sh-foot"><span>Registo: ${new Date(r.created_at).toLocaleDateString('pt-PT')}</span><span>Impresso em ${new Date().toLocaleDateString('pt-PT')}</span></div>`;
  };
  app.innerHTML = `
    <div class="toolbar noprint">
      <a class="btn" href="#/tipo/${r.tipo}">← ${esc(t.nome)}</a>
      <span class="spacer"></span>
      <a class="btn" href="#/editar/${r.id}">Editar</a>
      <a class="btn" href="#/duplicar/${r.id}">Duplicar</a>
      <button class="btn pri" id="pr">Imprimir / PDF</button>
    </div>
    <div class="opts noprint"><label><input type="checkbox" id="ov"> Mostrar campos vazios</label></div>
    <div class="sheet" id="sheet"></div>`;
  $('#ov').onchange = draw;
  $('#pr').onclick = async () => {
    window.print();
  };
  draw();
}

/* ---------- ferramentas: importar / exportar ---------- */
function viewTools(){
  app.innerHTML = `<h1>Ferramentas</h1>
  <div class="card" style="margin-bottom:12px"><h2>Importar do Excel (Registo_Afinacoes_Teares.xlsx)</h2>
    <p style="margin-top:0;color:var(--ink2)">Lê as folhas Jersey, Felpas, Rib, Dupla Face, Felpa Italiana, Piqué e Interlock. Linhas sem Nº Tear são ignoradas e registos que já existam (mesmo tipo, tear, data e cliente) não são duplicados.</p>
    <input type="file" id="xl" accept=".xlsx,.xlsm"> <button class="btn pri" id="doimp" disabled>Importar</button>
    <div id="implog" style="margin-top:10px;font-size:13px;white-space:pre-wrap"></div></div>
  <div class="card"><h2>Exportar</h2>
    <button class="btn" id="expcsv">Exportar tudo (CSV)</button> <button class="btn" id="expjson">Cópia de segurança (JSON)</button></div>`;
  $('#xl').onchange = e => $('#doimp').disabled = !e.target.files.length;
  $('#doimp').onclick = importarExcel;
  $('#expjson').onclick = () => baixar('afinacoes-backup-'+hoje()+'.json', JSON.stringify({regs:S.regs},null,1), 'application/json');
  $('#expcsv').onclick = () => {
    const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
    const lines = [['Tipo','Nº Tear','Data','Cliente','Campo','Valor'].map(q).join(';')];
    S.regs.forEach(r => { const base=[TIPOS[r.tipo].nome,r.tear,fmtData(r.data),r.cliente];
      Object.entries(r.dados||{}).forEach(([k,v]) => {
        if(Array.isArray(v)) v.forEach((o,i) => Object.entries(o).forEach(([kk,vv]) => lines.push([...base,labelOf(r.tipo,kk)+` (linha ${i+2})`,vv].map(q).join(';'))));
        else lines.push([...base,labelOf(r.tipo,k),v].map(q).join(';')); });
      if(r.observacoes) lines.push([...base,'Observações',r.observacoes].map(q).join(';')); });
    baixar('afinacoes-'+hoje()+'.csv', '﻿'+lines.join('\r\n'), 'text/csv');
  };
}
function baixar(nome, txt, mime){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:mime})); a.download=nome; a.click(); }

function carregarSheetJS(){
  return window.XLSX ? Promise.resolve() : new Promise((ok,ko)=>{ const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=ok; s.onerror=()=>ko(new Error('Não foi possível carregar a biblioteca de Excel')); document.head.appendChild(s); });
}
async function importarExcel(){
  const log = $('#implog'); const file = $('#xl').files[0]; if(!file) return;
  $('#doimp').disabled = true; log.textContent = 'A ler o ficheiro…';
  try{
    await carregarSheetJS();
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true});
    const novos = []; let ign = 0, dups = 0; const resumo = [];
    const chaves = new Set(S.regs.map(r => [r.tipo,r.tear,r.data,r.cliente.toLowerCase()].join('|')));
    for(const [tipo,t] of Object.entries(TIPOS)){
      const nomeFolha = wb.SheetNames.find(n => n.trim().toLowerCase()===t.sheet.toLowerCase()); if(!nomeFolha) continue;
      const linhas = XLSX.utils.sheet_to_json(wb.Sheets[nomeFolha], {header:1, raw:true, defval:null, range:3});
      let n=0;
      for(const ln of linhas){
        const o = {dados:{}};
        t.xl.forEach((k,i) => {
          let v = ln[i]; if(v===null || v===undefined || k==='skip') return;
          if(typeof v==='string' && v.startsWith('=')) return;
          if(v instanceof Date){ const x=new Date(v.getTime()+12*36e5); v = `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
          v = String(v).trim(); if(!v) return;
          if(['tear','data','cliente','observacoes'].includes(k)) o[k]=v; else o.dados[k]=v;
        });
        o.tear = parseInt(o.tear,10);
        if(!o.tear || !/^\d{4}-\d{2}-\d{2}$/.test(o.data||'') || !o.cliente){ if(Object.keys(o.dados).length||o.tear) ign++; continue; }
        const ch = [tipo,o.tear,o.data,o.cliente.toLowerCase()].join('|');
        if(chaves.has(ch)){ dups++; continue; } chaves.add(ch);
        novos.push({tipo, tear:o.tear, data:o.data, cliente:o.cliente, observacoes:o.observacoes||null, dados:o.dados}); n++;
      }
      resumo.push(`${t.nome}: ${n} novos`);
    }
    for(let i=0;i<novos.length;i+=100){ const {error}=await sb.from(T_REG).insert(novos.slice(i,i+100)); if(error) throw error; }
    await loadAll(); drawTabs('');
    log.textContent = `Concluído.\n${resumo.join('\n')}\nJá existentes (ignorados): ${dups}\nIncompletos (sem tear/data/cliente): ${ign}`;
  }catch(e){ log.textContent = 'Erro: '+(e.message||e); }
  $('#doimp').disabled = false;
}

/* =====================================================================
   4. ARRANQUE
   ===================================================================== */
async function boot(){
  if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
  $('#btnTools').onclick = () => location.hash = '#/ferramentas';
  if(!configured) return render();
  sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  $('#btnOut').onclick = () => sb.auth.signOut();
  const {data:{session}} = await sb.auth.getSession();
  S.user = session?.user || null;
  if(S.user) { try{ await loadAll(); }catch(e){ toast('Erro a carregar: '+e.message, true); } }
  render();
  sb.auth.onAuthStateChange(async (ev, s) => {
    const novo = s?.user || null;
    if((novo?.id) === (S.user?.id)) return;
    S.user = novo;
    if(S.user){ try{ await loadAll(); }catch(e){ toast('Erro a carregar: '+e.message, true); } } else { S.regs=[]; }
    render();
  });
}
boot();
